project:
  name: "ExpNew1"
  experiment_name: "linear-system-answers-test-4"
  hf_checkpoint: "ExplosionNuclear/ExpNew2-GMSK8-test-1"

clearml:
  project_name: ${project.name}
  task_name: ${project.experiment_name}
  output_uri: false

dataset:
  name: "ExplosionNuclear/ExpNew1"
  train_size: 12000
  eval_size: 2000
  max_length: 800
  p: 1.0  # probability for randomized formatting

model:
  name: "meta-llama/Llama-3.2-3B-Instruct"
  dtype: "bfloat16"
  device_map: "cuda"
  attn_implementation: "flash_attention_2"
  special_tokens:
    - "<simple_talk>"
    - "</simple_talk>"

peft:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "lora_only"
  task_type: "CAUSAL_LM"
  use_rslora: false
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
    - "o_proj"

trainer:
  output_dir: "./flux1-dev-checkpoints"
  num_train_epochs: 8
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 8
  learning_rate: 3e-4
  weight_decay: 0.01
  lr_scheduler_type: "linear"
  warmup_steps: 100
  logging_steps: 10
  save_steps: 100
  bf16: true
  tf32: true
  gradient_checkpointing: true
  optim: "adamw_torch"
  report_to: []
  max_grad_norm: 0.3
  ddp_find_unused_parameters: false
  push_to_hub: true
  hub_model_id: ${project.hf_checkpoint}
  eval_strategy: "epoch"